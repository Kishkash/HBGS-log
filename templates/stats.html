{% extends "base.html" %}
{% block content %}

<div class="text-center mb-4">
    <div class="hero-title">Games played in 2026</div>
</div>

<!-- Responsive container -->
<div class="mb-3 d-flex flex-column flex-md-row align-items-md-center gap-3">

    <!-- Period (always first row on mobile, inline on desktop) -->
    <div class="d-flex align-items-center gap-2">
        <label class="form-label mb-0">Period:</label>

        <select id="period" class="form-select w-auto">
            <option value="overall">Overall</option>
            <option value="month">Month</option>
            <option value="date">Date</option>
        </select>
    </div>

    <!-- Month/Date + Load (second row on mobile, same row on desktop) -->
    <div class="d-flex align-items-center gap-3 flex-wrap">

        <span id="month-wrap" style="display:none;">
            <span class="d-inline-flex align-items-center gap-1">
                <span>Month:</span>
                <input type="number" id="month" min="1" max="12" class="form-control w-auto">
            </span>
        </span>

        <span id="date-wrap" style="display:none;">
            <span class="d-inline-flex align-items-center gap-1">
                <span>Date:</span>
                <input type="date" id="date" class="form-control w-auto">
            </span>
        </span>

        <button id="load" class="btn btn-warning">Load</button>
    </div>

</div>

<!-- height scrollable container -->
<div class="table-responsive" style="max-height: 70vh; overflow-y: auto;">
    <table class="table table-striped align-middle">
        <thead class="table-light" style="position: sticky; top: 0; z-index: 2;">
            <tr>
                <th>#</th>
                <th>Box</th>
                <th>Game</th>
                <th>Plays</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
</div>

<script>
    const periodEl = document.getElementById('period');
    const monthWrap = document.getElementById('month-wrap');
    const dateWrap = document.getElementById('date-wrap');

    periodEl.addEventListener('change', () => {
        const p = periodEl.value;
        monthWrap.style.display = (p === 'month') ? 'inline' : 'none';
        dateWrap.style.display = (p === 'date') ? 'inline' : 'none';
    });

    async function loadStats() {
        const period = periodEl.value;
        const params = new URLSearchParams({ period });

        if (period === 'month') {
            const m = document.getElementById('month').value;
            if (!m) return alert("Enter month");
            params.append('year', 2026);   // default year behind the scenes
            params.append('month', m);
        } else if (period === 'date') {
            const d = document.getElementById('date').value;
            if (!d) return alert("Select date");
            params.append('date', d);
        }

        const res = await fetch('/api/stats?' + params.toString());
        const data = await res.json();
        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';

        data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row.index}</td>
                <td>${row.image_url ? `<img src="${row.image_url}" class="img-fluid" style="max-width:50px">` : ''}</td>
                <td style="white-space: normal; word-break: break-word;">${row.game_name}</td>
                <td>${row.plays}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        monthWrap.style.display = 'none';
        dateWrap.style.display = 'none';
        loadStats();
    });

    document.getElementById('load').addEventListener('click', loadStats);
</script>

{% endblock %}
