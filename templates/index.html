{% extends "base.html" %}

{% block content %}

    <div class="text-center mb-4">
        <div class="hero-title">Highgate Board Game Society</div>
        <div class="hero-subtitle"><a href="{{ url_for('contact') }}">Join us</a> for a game every Monday at 7:30pm
        </div>
    </div>

    <div class="games-section-lower">
        <div class="section-title text-center">Games played last week:</div>

        <!-- Collage container -->

        <div id="games-grid"
             class="row justify-content-center row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3">
            <!-- JS will insert <div class="col"><img ...></div> here -->
        </div>
    </div>


    <script>
    // Returns YYYY-MM-DD for:
    // - last week's Monday if today is Monday
    // - this week's Monday otherwise
    function getRelevantMonday() {
        const today = new Date();
        const day = today.getDay(); // 0=Sun, 1=Mon, ..., 6=Sat

        const monday = new Date();

        if (day === 1) {
            // Today is Monday → go back 7 days
            monday.setDate(today.getDate() - 7);
        } else {
            // Any other day → go back to this week's Monday
            // Sunday (0) should go back 6 days
            const daysSinceMonday = (day === 0) ? 6 : (day - 1);
            monday.setDate(today.getDate() - daysSinceMonday);
        }

        return monday.toISOString().slice(0, 10);
    }

    async function loadGames() {
        const date = getRelevantMonday();
        const url = `/api/stats?period=date&date=${date}`;

        try {
            const response = await fetch(url);
            const games = await response.json();

            const grid = document.getElementById("games-grid");
            grid.innerHTML = "";

            games.forEach(game => {
                const col = document.createElement("div");
                col.className = "col";

                col.innerHTML = `
                    <img src="${game.image_url}"
                         alt="${game.game_name}"
                         class="img-fluid game-img">
                `;

                grid.appendChild(col);
            });

        } catch (err) {
            console.error("Failed to load games:", err);
        }
    }

    loadGames();
    </script>

{% endblock %}
