{% extends "base.html" %}

{% block content %}

    <div class="text-center mb-4">
        <div class="hero-title">Highgate Board Game Society</div>
        <div class="hero-subtitle"><a href="{{ url_for('contact') }}">Join us</a> for a game every Monday at 7:30pm
        </div>
    </div>

    <div class="games-section-lower">
        <div class="section-title text-center">Recently played games:</div>

        <!-- Collage container -->

        <div id="games-grid"
             class="row justify-content-center row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3">
            <!-- JS will insert <div class="col"><img ...></div> here -->
        </div>
    </div>


    <script>
        async function loadGames() {
            const grid = document.getElementById("games-grid");
            grid.innerHTML = "";

            const response = await fetch("/api/stats?period=recent");
            const games = await response.json();

            if (games.length === 0) {
                grid.innerHTML = `
                    <div class="text-center mt-3" style="font-size: 1.2rem;">
                        No games found.
                    </div>
                `;
                return;
            }

            games.forEach(game => {
                const col = document.createElement("div");
                col.className = "col";

                col.innerHTML = `
                    <img src="${game.image_url}"
                         alt="${game.game_name}"
                         class="img-fluid game-img">
                `;

                grid.appendChild(col);
            });
        }

        loadGames();

    </script>

{% endblock %}
